<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StarPit - Pengajuan Aplikasi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#14141c;--card2:#1c1c27;--border:#262631;--text:#e5e5e5;--muted:#8b8b9e;--accent:#7c5cff;--accent2:#4ae3b5;--red:#ff4d6d}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif}.nav{position:sticky;top:0;z-index:99;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-family:Space Grotesk;font-weight:700;font-size:20px}.logo span{color:var(--accent)}.nav-links{display:flex;gap:8px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--border)}.nav-links button{padding:8px 16px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600}.nav-links button.active{background:var(--accent);color:white}.container{max-width:900px;margin:0 auto;padding:20px}.hero{text-align:center;margin:30px 0}.hero h1{font-family:Space Grotesk;font-size:38px;line-height:1.1}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-top:20px}.info-box{background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(74,227,181,.1));border:1px solid rgba(124,92,255,.3);border-radius:14px;padding:16px;margin-bottom:20px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.field label span{color:var(--red)}.field input,.field textarea,.field select{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;outline:none;width:100%}.field textarea{min-height:100px}.hint{font-size:11px;color:var(--muted)}.labels{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.label-chip{padding:5px 10px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--card2)}.label-chip.selected{background:var(--accent);border-color:var(--accent);color:white}.btn{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}.page{display:none}.page.active{display:block}.toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--border);padding:14px 18px;border-radius:12px;display:none;z-index:999}
</style></head><body>
<div class="nav"><div class="logo">STAR<span>PIT</span></div><div class="nav-links"><button class="active" onclick="switchPage('new')">Pengajuan Baru</button><button onclick="switchPage('update')">Update APK</button></div></div>
<div class="container"><div id="page-new" class="page active"><div class="hero"><h1>Publikasikan Aplikasi ke StarPit</h1><p style="color:var(--muted)">Isi form lengkap, review 1-24 jam</p></div><div class="info-box"><b>📋 Cara Upload:</b> Icon & Screenshot upload ke imgix.net / catbox.moe -> copy link direct. APK upload ke MediaFire -> copy link.</div><div class="card"><form id="formNew"><div class="field"><label>Email Dev <span>*</span></label><input type="email" id="email" required placeholder="dev@gmail.com"></div><div class="grid"><div class="field"><label>Package <span>*</span></label><input id="package" required placeholder="com.nama.nama"></div><div class="field"><label>Nama Aplikasi <span>*</span></label><input id="nama" required></div></div><div class="grid"><div class="field"><label>Nama Developer <span>*</span></label><input id="developer" required></div><div class="field"><label>Kategori <span>*</span></label><select id="kategori" required><option value="">Pilih</option><option>aplikasi</option><option>game</option></select></div></div><div class="field"><label>Sub Kategori</label><input id="subKategori" placeholder="Petualangan & Sandbox"></div><div class="grid"><div class="field"><label>Icon APK URL (imgix) <span>*</span></label><input id="icon" required placeholder="https://..."></div><div class="field"><label>Banner IMG URL <span>*</span></label><input id="banner" required></div></div><div class="field"><label>Deskripsi <span>*</span></label><textarea id="deskripsi" required></textarea></div><div class="grid"><div class="field"><label>Ukuran APK <span>*</span></label><input id="ukuran" required placeholder="150 MB (max 5GB)"></div><div class="field"><label>Versi APK <span>*</span></label><input id="versi" required placeholder="1.0.0"></div></div><div class="field"><label>Link Apk MediaFire <span>*</span></label><input id="linkApk" required placeholder="https://www.mediafire.com/..."></div><div class="grid"><div class="field"><label>Total Review</label><input id="totalReview" type="number" placeholder="1250"></div><div class="field"><label>WhatsNew (opsional)</label><input id="whatsnewNew" placeholder="Fix bug"></div></div><div class="field"><label>Label <span>*</span></label><div class="labels" id="labelsContainer"></div></div><div class="field"><label>Screenshot 1 <span>*</span></label><input id="ss1" required><label>Screenshot 2 <span>*</span></label><input id="ss2" required style="margin-top:6px"><label>Screenshot 3 <span>*</span></label><input id="ss3" required style="margin-top:6px"><div class="hint">Wajib 3 foto, upload ke imgix.net dulu</div></div><button class="btn" type="submit" id="btnNew">Kirim Pengajuan 🚀</button></form></div></div><div id="page-update" class="page"><div class="hero"><h1>Update Versi Aplikasi</h1></div><div class="card"><form id="formUpdate"><div class="field"><label>Email Dev (sama kayak pengajuan) <span>*</span></label><input id="u_email" type="email" required></div><div class="field"><label>Nama Package <span>*</span></label><input id="u_package" required placeholder="com.nama.nama"></div><div class="field"><label>Link MediaFire Baru <span>*</span></label><input id="u_link" required></div><div class="field"><label>Versi Baru <span>*</span></label><input id="u_versi" required></div><div class="field"><label>WhatsNew <span>*</span></label><textarea id="u_whatsnew" required></textarea></div><button class="btn" type="submit" id="btnUpdate">Kirim Update 📦</button></form></div></div></div><div class="toast" id="toast"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL = "https://uvggxoqoucjxycdhgzos.supabase.co";
const SUPABASE_KEY = "sb_publishable_4uEcbSMrYegwqF3792jm8w_OgYnKYYu";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const allLabels = ["#webview","#ai","#online","#offline","#tools","#utility","#premium","#mod","#pro","#games","#action","#rpg","#simulation","#strategy","#casual","#adventure","#puzzle","#arcade","#anime","#pixelart","#openworld","#multiplayer","#fps","#racing","#sports","#horror","#survival","#sandbox","#education","#productivity","#social","#entertainment","#photography","#videoeditor","#music","#downloader","#automation","#finance","#lifestyle","#customization","#launcher","#widget","#iconpack","#root","#noboot","#lightweight","#fast","#secure","#adfree","#free"];
let selectedLabels = [];
const container = document.getElementById('labelsContainer');
allLabels.forEach(l=>{ const div=document.createElement('div'); div.className='label-chip'; div.textContent=l; div.onclick=()=>{div.classList.toggle('selected'); if(selectedLabels.includes(l)) selectedLabels=selectedLabels.filter(x=>x!==l); else selectedLabels.push(l);}; container.appendChild(div);});
window.switchPage = (p)=>{ document.querySelectorAll('.page').forEach(el=>el.classList.remove('active')); document.querySelectorAll('.nav-links button').forEach(b=>b.classList.remove('active')); if(p==='new'){document.getElementById('page-new').classList.add('active'); document.querySelectorAll('.nav-links button')[0].classList.add('active')} else{document.getElementById('page-update').classList.add('active'); document.querySelectorAll('.nav-links button')[1].classList.add('active')}}
function toast(msg, ok=true){const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; t.style.background=ok?'#1c1c27':'#2a1a1e'; setTimeout(()=>t.style.display='none',4000)}
document.getElementById('formNew').addEventListener('submit', async (e)=>{
  e.preventDefault(); if(selectedLabels.length===0) return toast('Pilih minimal 1 label', false);
  const btn=document.getElementById('btnNew'); btn.disabled=true; btn.textContent='Mengirim...';
  try{
    const { error } = await supabase.from('submissions').insert([{type:'new',email:document.getElementById('email').value.trim().toLowerCase(),package:document.getElementById('package').value.trim(),nama:document.getElementById('nama').value.trim(),developer:document.getElementById('developer').value.trim(),kategori:document.getElementById('kategori').value,sub_kategori:document.getElementById('subKategori').value.trim(),icon:document.getElementById('icon').value.trim(),banner:document.getElementById('banner').value.trim(),deskripsi:document.getElementById('deskripsi').value.trim(),ukuran:document.getElementById('ukuran').value.trim(),link_apk:document.getElementById('linkApk').value.trim(),versi:document.getElementById('versi').value.trim(),total_review:document.getElementById('totalReview').value.trim(),whats_new:document.getElementById('whatsnewNew').value.trim(),labels:selectedLabels,ss1:document.getElementById('ss1').value.trim(),ss2:document.getElementById('ss2').value.trim(),ss3:document.getElementById('ss3').value.trim(),status:'pending'}]);
    if(error) throw error;
    toast('✅ Pengajuan berhasil!'); e.target.reset(); selectedLabels=[]; document.querySelectorAll('.label-chip').forEach(c=>c.classList.remove('selected'));
  }catch(err){toast('Gagal: '+err.message,false)} 
  btn.disabled=false; btn.textContent='Kirim Pengajuan 🚀';
});
document.getElementById('formUpdate').addEventListener('submit', async (e)=>{
  e.preventDefault(); const btn=document.getElementById('btnUpdate'); btn.disabled=true; btn.textContent='Mengirim...';
  try{
    const { error } = await supabase.from('submissions').insert([{type:'update',email:document.getElementById('u_email').value.trim().toLowerCase(),package:document.getElementById('u_package').value.trim(),link_apk:document.getElementById('u_link').value.trim(),versi:document.getElementById('u_versi').value.trim(),whats_new:document.getElementById('u_whatsnew').value.trim(),status:'pending_update'}]);
    if(error) throw error;
    toast('✅ Update terkirim!'); e.target.reset();
  }catch(err){toast('Gagal: '+err.message,false)}
  btn.disabled=false; btn.textContent='Kirim Update 📦';
});
</script></body></html>
